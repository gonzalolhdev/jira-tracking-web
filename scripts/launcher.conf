# Per-app settings for the hot/cold launcher. launch.sh and build-apps.sh are
# identical in every local app; only this file differs.
# Convention + port registry: ~/.claude/skills/local-app-launcher and ~/.local-apps/ports.md
APP_NAME="Jira Track"            # Name of the hot .app; the cold one is "<APP_NAME> (cold)"
APP_SLUG="jira-track"            # Log file name: $TMPDIR/<slug>-launcher.log
PORT=4700                        # Host port the UI is served on. Must match docker-compose.yml
HEALTH_PATH="/api/health"        # Must return 200 once the app is ready
ICON_HOT="JiraTrack.icns"        # Files in scripts/icon/
ICON_COLD="JiraTrackCold.icns"
