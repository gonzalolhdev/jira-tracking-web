[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-tracking-web"
version = "0.1.0"
description = "CLI helper to discover Jira issues worked and log work with confirmation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "playwright>=1.52.0",
  "pydantic>=2.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pyinstrument>=5.1.0",
  "ruff>=0.5.0",
]

[project.scripts]
jira-track = "jira_tracking_bot.cli:app"
jira-track-web = "jira_tracking_bot.web.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
