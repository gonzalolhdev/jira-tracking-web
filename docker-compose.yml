services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      JIRA_TRACK_JIRA_BASE_URL: ${JIRA_TRACK_JIRA_BASE_URL}
      JIRA_TRACK_TEMPO_API_TOKEN: ${JIRA_TRACK_TEMPO_API_TOKEN:-}
      JIRA_TRACK_TEMPO_API_BASE: ${JIRA_TRACK_TEMPO_API_BASE:-https://api.tempo.io/4}
      JIRA_TRACK_TIMEZONE: ${JIRA_TRACK_TIMEZONE:-America/New_York}
      JIRA_TRACK_DEFAULT_PROJECTS: ${JIRA_TRACK_DEFAULT_PROJECTS:-}
      JIRA_TRACK_IN_PROGRESS_STATUSES: ${JIRA_TRACK_IN_PROGRESS_STATUSES:-In Progress}
      JIRA_TRACK_SECONDARY_TRACKING_STATUSES: ${JIRA_TRACK_SECONDARY_TRACKING_STATUSES:-}
      JIRA_TRACK_SESSION_STATE_PATH: .jira-track/session.json
      JIRA_TRACK_DEBUG: ${JIRA_TRACK_DEBUG:-false}
      JIRA_TRACK_CDP_URL: ${JIRA_TRACK_CDP_URL:-http://host.docker.internal:9222}
      JIRA_TRACK_CDP_ALLOWED_HOSTS: ${JIRA_TRACK_CDP_ALLOWED_HOSTS:-127.0.0.1,localhost,host.docker.internal}
      JIRA_TRACK_CORS_ORIGINS: ${JIRA_TRACK_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      JIRA_TRACK_WEB_FORWARDED_ALLOW_IPS: ${JIRA_TRACK_WEB_FORWARDED_ALLOW_IPS:-127.0.0.1}
      JIRA_TRACK_WEB_RELOAD: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.jira-track:/app/.jira-track
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
